---
# ============================================================================
# Drakos Cave SOC - Fondo de pantalla de bloqueo / inicio de sesion
# Fecha: 2026-09-17
# Version: v3
#
# IMPORTANTE - por que el metodo anterior no funciono:
#   OEMBackground + C:\Windows\System32\oobe\info\backgrounds\ es un mecanismo
#   de Windows 7. Desde Windows 8 / Server 2012 el sistema lo ignora.
#   El metodo vigente en Windows 10/11 y Server 2016-2025 es la politica
#   de Personalizacion: LockScreenImage.
#
# Registro que se aplica:
#   HKLM\SOFTWARE\Policies\Microsoft\Windows\Personalization
#     - LockScreenImage        (REG_SZ)  -> ruta absoluta de la imagen
#     - LockScreenOverlaysDisabled (DWORD) -> quita overlays de apps
#   HKLM\SOFTWARE\Policies\Microsoft\Windows\System
#     - DisableAcrylicBackgroundOnLogon (DWORD) -> quita el desenfoque acrilico
#
# NOTA DE VERIFICACION: la pantalla de bloqueo NO se ve por RDP.
# Hay que validar en la consola fisica o en la consola de la VM.
#
#   ansible-playbook -i inventory set_lockscreen_image.yml
#   ansible-playbook -i inventory set_lockscreen_image.yml -e "lockscreen_state=absent"
# ============================================================================
- name: Drakos SOC - Configurar imagen de pantalla de bloqueo
  hosts: windows
  gather_facts: no

  vars:
    lockscreen_state: present

    # Ruta de origen: la imagen ya desplegada por el metodo anterior.
    # Se reutiliza para no volver a transferir archivos (SFTP/SCP falla).
    source_image: 'C:\Windows\System32\oobe\info\backgrounds\backgroundDefault.jpg'

    # Destino definitivo. Fuera de System32 para evitar que Windows Update
    # o un sfc /scannow lo sobrescriban.
    image_dir: 'C:\ProgramData\DrakosCave'
    image_path: 'C:\ProgramData\DrakosCave\lockscreen.jpg'

    personalization_key: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization'
    system_key: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'

    # 1 = quita el desenfoque acrilico del logon (imagen nitida)
    disable_acrylic: 1

  tasks:
    - name: "[1/6] Crear directorio de recursos de Drakos Cave"
      ansible.windows.win_file:
        path: "{{ image_dir }}"
        state: directory
      when: lockscreen_state == 'present'

    - name: "[2/6] Mover la imagen a su ubicacion definitiva"
      ansible.windows.win_powershell:
        script: |
          $src = '{{ source_image }}'
          $dst = '{{ image_path }}'

          if (-not (Test-Path $src)) {
            throw "No se encontro la imagen de origen: $src"
          }

          $needsCopy = $true
          if (Test-Path $dst) {
            $hSrc = (Get-FileHash $src -Algorithm SHA256).Hash
            $hDst = (Get-FileHash $dst -Algorithm SHA256).Hash
            $needsCopy = ($hSrc -ne $hDst)
          }

          if ($needsCopy) {
            Copy-Item -Path $src -Destination $dst -Force
          }

          # LogonUI corre como usuario del sistema y debe poder leer el archivo.
          # Sin lectura para Users, la pantalla queda en negro sin aviso.
          $acl = Get-Acl -Path $dst
          $acl.SetAccessRuleProtection($false, $true)
          $sidUsers = New-Object System.Security.Principal.SecurityIdentifier('S-1-5-32-545')
          $rule = New-Object System.Security.AccessControl.FileSystemAccessRule(
              $sidUsers, 'Read', 'None', 'None', 'Allow')
          $acl.AddAccessRule($rule)
          Set-Acl -Path $dst -AclObject $acl

          @{
            Copied  = $needsCopy
            SizeKB  = [math]::Round((Get-Item $dst).Length / 1KB, 1)
            Path    = $dst
          }
      register: img_move
      changed_when: img_move.output[0].Copied
      when: lockscreen_state == 'present'

    - name: "[3/6] Aplicar politica LockScreenImage"
      ansible.windows.win_regedit:
        path: "{{ personalization_key }}"
        name: LockScreenImage
        data: "{{ image_path }}"
        type: string
        state: "{{ lockscreen_state }}"
      register: policy_result

    - name: "[4/6] Deshabilitar overlays sobre la pantalla de bloqueo"
      ansible.windows.win_regedit:
        path: "{{ personalization_key }}"
        name: LockScreenOverlaysDisabled
        data: 1
        type: dword
        state: "{{ lockscreen_state }}"

    - name: "[5/6] Quitar desenfoque acrilico del logon (imagen nitida)"
      ansible.windows.win_regedit:
        path: "{{ system_key }}"
        name: DisableAcrylicBackgroundOnLogon
        data: "{{ disable_acrylic }}"
        type: dword
        state: "{{ lockscreen_state }}"

    - name: "[6/6] Verificar configuracion aplicada"
      ansible.windows.win_powershell:
        script: |
          $pKey = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization'
          $sKey = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
          $img  = '{{ image_path }}'

          $lsi = (Get-ItemProperty -Path $pKey -Name LockScreenImage -ErrorAction SilentlyContinue).LockScreenImage
          $acr = (Get-ItemProperty -Path $sKey -Name DisableAcrylicBackgroundOnLogon -ErrorAction SilentlyContinue).DisableAcrylicBackgroundOnLogon
          $f   = Get-Item -Path $img -ErrorAction SilentlyContinue

          # Confirma que el grupo Users puede leer la imagen
          $canRead = $false
          if ($f) {
            $acl = Get-Acl -Path $img
            $canRead = [bool]($acl.Access | Where-Object {
              $_.IdentityReference -match 'Users|Usuarios|TODOS|Everyone' -and
              $_.FileSystemRights -match 'Read|FullControl' -and
              $_.AccessControlType -eq 'Allow'
            })
          }

          @{
            Host           = $env:COMPUTERNAME
            PolicyPath     = if ($lsi) { $lsi } else { '(no configurado)' }
            ImageExists    = [bool]$f
            ImageKB        = if ($f) { [math]::Round($f.Length / 1KB, 1) } else { 0 }
            UsersCanRead   = $canRead
            AcrylicDisabled = if ($null -ne $acr) { $acr } else { '(ausente)' }
            PathsMatch     = ($lsi -eq $img)
          }
      register: verify
      changed_when: false

    - name: "Reporte por host"
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} |
          politica='{{ verify.output[0].PolicyPath }}' |
          imagen={{ verify.output[0].ImageKB }} KB
          (existe={{ verify.output[0].ImageExists }},
           lectura_users={{ verify.output[0].UsersCanRead }}) |
          rutas_coinciden={{ verify.output[0].PathsMatch }} |
          acrilico_off={{ verify.output[0].AcrylicDisabled }}

  post_tasks:
    - name: "Nota de verificacion"
      ansible.builtin.debug:
        msg:
          - "La pantalla de bloqueo NO se muestra por RDP."
          - "Valida en la consola fisica o en la consola de la VM."
          - "Si no aparece de inmediato, ejecuta en el host: gpupdate /force"
          - "En algunos casos requiere cerrar sesion o reiniciar LogonUI."
      run_once: true
